name: Publish Go Module

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: '1.22.1'

    - name: Build and Publish
      run: |
        go mod tidy
        go mod vendor
        go build -o ./bin/slack-sdk-go ./pkg/slack
        GOPROXY=proxy.golang.org go list -m github.com/PramithaMJ/slack-sdk-go
      env:
        GOROOT: /opt/hostedtoolcache/go/1.22.1/x64
        GITHUB_TOKEN: ${{ secrets.GITHUB_PKG_TOKEN }}
