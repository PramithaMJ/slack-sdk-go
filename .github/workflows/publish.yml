name: Publish Package

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: '1.17'

    - name: Build
      run: go build -v ./...

    - name: Publish to GitHub Packages
      run: |
        echo "//${{ github.repository_owner }}:${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
        go mod tidy
        go mod vendor
        go build -o ./bin/slack-sdk-go .
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_PKG_TOKEN }}
